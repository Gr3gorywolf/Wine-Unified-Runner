; WUR per-game launch overrides
; This file is created next to a Windows executable as wur-overrides.ini.
; Remove the leading semicolon from a setting to enable it. These values apply
; only to this launch and never modify the selected container's container.json.
;
; Precedence:
;   1. `wur run GAME.exe --container NAME` selects NAME and ignores [container] name.
;   2. Without --container, [container] name selects the container when enabled.
;   3. All other sections apply in both cases.

[container]
; name = my-container

[runtime]
; source = wine-crossover
; version = latest

[components]
; dxvk.enabled = true
; dxvk.version = latest
; dxvkNvapi.enabled = false
; dxvkNvapi.version = latest
; vkd3d.enabled = true
; vkd3d.version = latest
; eacRuntime.enabled = false
; eacRuntime.version = latest
; battleyeRuntime.enabled = false
; battleyeRuntime.version = latest

[launch]
; enableEsync = true
; enableFsync = true
; enableMsync = false
; enableWayland = false
; enableHdr = false
; enableWow64 = false
; showFps = false
; dxvkFrameRate = null
; fsr = false
; fsrSharpness = 2
; verboseLogs = false

[environment]
; DXVK_ASYNC = 1
; WINEDEBUG = -all
