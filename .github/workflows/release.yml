name: Build and release WUR

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wur-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  build-macos-universal:
    name: macOS universal
    needs: test
    # The build script downloads both Node architectures and combines them
    # with lipo, so an Intel runner can produce the universal binary.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build universal standalone binary
        run: npm run build-binary -- --clean
      - name: Package macOS release archive
        shell: bash
        run: |
          set -euo pipefail

          # This initializes the platform-aware defaults generated by WUR.
          ./release/wur defaults show >/dev/null

          archive_name='wur-macos-universal.zip'
          package_dir="dist/${archive_name%.zip}"
          mkdir -p "$package_dir"
          cp release/wur "$package_dir/wur"
          cp release/config/defaults.json "$package_dir/defaults.json"
          cp release/wur-overrides.template.jsonc "$package_dir/wur-overrides.template.jsonc"

          (
            cd "$package_dir"
            zip -9 "../$archive_name" wur defaults.json wur-overrides.template.jsonc
          )
          rm -rf "$package_dir"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: wur-macos-universal
          path: dist/wur-macos-universal.zip
          if-no-files-found: error
          retention-days: 14

  build-linux-x86_64:
    name: Linux x86_64
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build x86_64 standalone binary
        run: npm run build-binary -- --clean
      - name: Package Linux x86_64 release archive
        shell: bash
        run: |
          set -euo pipefail

          # This initializes the platform-aware defaults generated by WUR.
          ./release/wur defaults show >/dev/null

          archive_name='wur-linux-x86_64.zip'
          package_dir="dist/${archive_name%.zip}"
          mkdir -p "$package_dir"
          cp release/wur "$package_dir/wur"
          cp release/config/defaults.json "$package_dir/defaults.json"
          cp release/wur-overrides.template.jsonc "$package_dir/wur-overrides.template.jsonc"

          (
            cd "$package_dir"
            zip -9 "../$archive_name" wur defaults.json wur-overrides.template.jsonc
          )
          rm -rf "$package_dir"
      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wur-linux-x86_64
          path: dist/wur-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  build-linux-arm64:
    name: Linux arm64
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build arm64 standalone binary
        run: npm run build-binary -- --clean
      - name: Package Linux arm64 release archive
        shell: bash
        run: |
          set -euo pipefail

          # This initializes the platform-aware defaults generated by WUR.
          ./release/wur defaults show >/dev/null

          archive_name='wur-linux-arm64.zip'
          package_dir="dist/${archive_name%.zip}"
          mkdir -p "$package_dir"
          cp release/wur "$package_dir/wur"
          cp release/config/defaults.json "$package_dir/defaults.json"
          cp release/wur-overrides.template.jsonc "$package_dir/wur-overrides.template.jsonc"

          (
            cd "$package_dir"
            zip -9 "../$archive_name" wur defaults.json wur-overrides.template.jsonc
          )
          rm -rf "$package_dir"
      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wur-linux-arm64
          path: dist/wur-linux-arm64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs:
      - build-macos-universal
      - build-linux-x86_64
      - build-linux-arm64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate or create the release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || {
            echo 'The release tag must begin with v, for example v0.1.0.' >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            git fetch --tags --force
            if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          fi
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: wur-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -type f -name '*.zip' -print | sort)
          ((${#archives[@]} == 3)) || {
            echo "Expected 3 release archives, found ${#archives[@]}." >&2
            exit 1
          }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${archives[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" \
              --title "WUR $RELEASE_TAG" \
              --generate-notes
          fi
